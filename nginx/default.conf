# Reverse proxy (14.6, 8 «Сетевая схема» ТЗ).
# Наружу открыт только этот контейнер; backend и БД — во внутренней сети.
# TLS в production терминируется здесь (или на внешнем Caddy/балансировщике) —
# см. README, раздел «Production».

server_tokens off;

# Сжатие текстовых ответов (статика фронта, JSON API). Экономит трафик и
# ускоряет отдачу; на уже сжатые типы (изображения) не влияет.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           text/javascript application/xml image/svg+xml;

# Ограничение частоты запросов к API (14.3.10)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;

    # Размер тела запроса — защита от больших загрузок (14.3.6)
    client_max_body_size 2m;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Более жёсткий лимит на вход — защита от brute force на уровне сети
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # AI-генерация (Этап 3) — синхронные запросы до AI_TIMEOUT_SECONDS,
    # поэтому только здесь proxy_read_timeout выше базовых 60s.
    # Остальной API работает с прежним таймаутом.
    location /api/ai/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA: все пути отдают index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
